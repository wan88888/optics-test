name: Optics iOS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: optics-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements-mobile.txt
      - run: python -m pip install -r ci/requirements-mobile.txt
      - name: Check CI configuration generation
        run: python -m unittest discover -s ci -p "test_*.py"
      - name: Validate CSV keywords and references
        run: optics dry_run ios --no-use-printer

  test:
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Set isolated CI paths
        run: |
          echo "SUITE_DIR=$RUNNER_TEMP/optics-ios" >> "$GITHUB_ENV"
          echo "APPIUM_HOME=$RUNNER_TEMP/appium-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements-mobile.txt
      - run: python -m pip install -r ci/requirements-mobile.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned Appium and driver
        run: |
          npm install --global appium@2.11.3
          appium driver install xcuitest@7.35.0
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Create and boot a clean iOS 18.5 simulator
        run: |
          simulator_udid=$(xcrun simctl create 'Optics CI iPhone' com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "OPTICS_CI_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
      - name: Download Swag Labs 2.7.1 simulator app
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
            https://github.com/saucelabs/sample-app-mobile/releases/download/2.7.1/iOS.Simulator.SauceLabs.Mobile.Sample.app.2.7.1.zip \
            --output "$RUNNER_TEMP/swag-labs-ios.zip"
          echo "a311c91b31e87c570208e74f1543f321de22a929f83996a26b6558c7789e96f8  $RUNNER_TEMP/swag-labs-ios.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/swag-labs-ios"
          ditto -x -k "$RUNNER_TEMP/swag-labs-ios.zip" "$RUNNER_TEMP/swag-labs-ios"
          test -d "$RUNNER_TEMP/swag-labs-ios/iOS.Simulator.SauceLabs.Mobile.Sample.app.2.7.1.app"
          lipo -verify_arch x86_64 "$RUNNER_TEMP/swag-labs-ios/iOS.Simulator.SauceLabs.Mobile.Sample.app.2.7.1.app/SwagLabsMobileApp"
      - name: Prepare simulator CI suite
        run: |
          python ci/prepare_suite.py ios "$SUITE_DIR" \
            --udid "$OPTICS_CI_UDID" --device-name 'Optics CI iPhone' --platform-version '18.5'
      - name: Run iOS suite
        run: bash ci/run_mobile.sh ios "$SUITE_DIR" "$RUNNER_TEMP/swag-labs-ios/iOS.Simulator.SauceLabs.Mobile.Sample.app.2.7.1.app"
      - name: Remove CI simulator
        if: always() && env.OPTICS_CI_UDID != ''
        run: |
          xcrun simctl shutdown "$OPTICS_CI_UDID" || true
          xcrun simctl delete "$OPTICS_CI_UDID"
      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Optics iOS results
          report_paths: ${{ env.SUITE_DIR }}/execution_output/junit_output.xml
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          # Fork PRs and Dependabot may only have a read-only token.
          annotate_only: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}
      # Optics screenshot names contain colons; upload an archive instead.
      - name: Archive logs and screenshots
        if: always()
        run: |
          if [ -d "$SUITE_DIR" ]; then
            tar -czf "$RUNNER_TEMP/optics-ios-output.tgz" -C "$SUITE_DIR" .
          fi
      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optics-ios-output
          path: ${{ runner.temp }}/optics-ios-output.tgz
          if-no-files-found: warn
          retention-days: 14
